<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" fill="none" role="img" aria-labelledby="esT esD"><title id="esT">Where a call stops</title><desc id="esD">A call runs left to right through inbound, disclosure and qualification before booking. A classifier runs on a separate line above it, watching every turn. When it fires, the conversation line is cut and the call is transferred to a person instead of continuing to booking.</desc><path d="M40 150 H470" stroke="currentColor" stroke-width="1.6" opacity=".65"/><path d="M470 150 H700" stroke="currentColor" stroke-width="1.6" opacity=".18" stroke-dasharray="3 7"/><g><circle cx="70" cy="150" r="5" stroke="currentColor" stroke-width="1.6" fill="var(--sc-node-fill,transparent)"/><text x="70" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="currentColor">INBOUND</text></g><g><circle cx="210" cy="150" r="5" stroke="currentColor" stroke-width="1.6" fill="var(--sc-node-fill,transparent)"/><text x="210" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="currentColor">DISCLOSURE</text></g><g><circle cx="350" cy="150" r="5" stroke="currentColor" stroke-width="1.6" fill="var(--sc-node-fill,transparent)"/><text x="350" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="currentColor">QUALIFY</text></g><g opacity=".35"><circle cx="610" cy="150" r="5" stroke="currentColor" stroke-width="1.6" fill="var(--sc-node-fill,transparent)"/><text x="610" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="currentColor">BOOK</text></g><path d="M40 62 H700" stroke="currentColor" stroke-width="1" opacity=".3" stroke-dasharray="2 6"/><text x="40" y="48" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="currentColor" opacity=".6">CLASSIFIER, RUNNING ALONGSIDE</text><path d="M110 68 V140" stroke="currentColor" stroke-width="1" opacity=".22"/><path d="M190 68 V140" stroke="currentColor" stroke-width="1" opacity=".22"/><path d="M270 68 V140" stroke="currentColor" stroke-width="1" opacity=".22"/><path d="M350 68 V140" stroke="currentColor" stroke-width="1" opacity=".22"/><path d="M430 68 V140" stroke="currentColor" stroke-width="1" opacity=".22"/><circle cx="470" cy="62" r="6" stroke="var(--accent)" stroke-width="2"/><path d="M470 70 V128" stroke="var(--accent)" stroke-width="2"/><text x="484" y="66" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="var(--accent)">CONFIDENCE 0.94</text><path d="M462 158 l16 -16 M462 142 l16 16" stroke="var(--accent)" stroke-width="2.4"/><text x="470" y="180" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="var(--accent)">INTAKE HALTED</text><path d="M470 194 V226 H660" stroke="var(--accent)" stroke-width="1.8"/><path d="M652 220 l10 6 l-10 6" stroke="var(--accent)" stroke-width="1.8"/><text x="660" y="216" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.4" fill="var(--accent)">DUTY SOLICITOR, 11s</text></svg>